name: Release

# 태그(vX.Y.Z)를 밀면 서명된 설치본과 자동 업데이트 매니페스트(latest.json)를 만들어
# 릴리스에 올린다. 서명 키·비밀번호는 이 저장소의 Actions 시크릿에만 있고(로컬·PR 로그
# 어디에도 노출되지 않는다), 서명은 러너 안에서만 일어난다.
on:
  push:
    tags:
      - "v*"

# 릴리스 생성·자산 업로드에 쓰기 권한이 필요하다. 그 외에는 주지 않는다.
permissions:
  contents: write

jobs:
  release:
    # 대상이 Windows 하나뿐이라 러너도 Windows 다. tauri-action 이 NSIS·MSI 를 굽고
    # createUpdaterArtifacts=true + 서명 키가 있으면 .sig 와 latest.json 까지 만들어 올린다.
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Rust 툴체인
        uses: dtolnay/rust-toolchain@stable

      - name: Node 설치
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Cargo 캐시
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: 의존성 설치
        run: npm ci

      - name: 빌드·서명·릴리스
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 두 시크릿은 저장소 소유자가 미리 넣어 둔다(RELEASE.md 참고).
          # 없으면 서명 단계에서 실패한다 — 서명되지 않은 업데이트를 조용히 내보내지 않는다.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Discan ${{ github.ref_name }}"
          # 첫 실행 SmartScreen 경고와 무결성 확인 안내는 릴리스 본문에도 남긴다.
          releaseBody: |
            Windows용 디스크 공간 분석기.

            설치본(NSIS `-setup.exe` 또는 MSI) 중 하나를 내려받으십시오. 코드 서명
            인증서가 없어 첫 실행 시 SmartScreen 경고가 뜰 수 있습니다 — 추가 정보 →
            실행. 이 앱은 파일을 읽어 크기만 세며 아무것도 지우지 않습니다.
          releaseDraft: false
          prerelease: false
